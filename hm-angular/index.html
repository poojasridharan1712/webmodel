
<!DOCTYPE html>
<html lang="en" ng-app="hotelApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking Management</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            color: #333;
        }

        header {
            background: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 900px;
            margin: 30px auto;
            padding: 15px;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        .booking {
            background: #e0ecff;
            padding: 10px;
            margin: 10px 0;
        }

        .delete {
            background: red;
        }

        .edit {
            background: teal;
        }

        .message {
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body ng-controller="hotelController">

    <header>
        <h1>🏨 Hotel Booking Management</h1>
        <p>Manage your guest room bookings</p>
    </header>

    <main class="container">

        <section class="panel">
            <h2>{{ editingId ? 'Edit Booking' : 'Add New Booking' }}</h2>

            <form ng-submit="saveBooking()">
                <label>Guest Name</label>
                <input type="text" ng-model="booking.guest"
                       placeholder="Enter guest name" required>

                <label>Room Number</label>
                <input type="text" ng-model="booking.room"
                       placeholder="Enter room number" required>

                <label>Room Type</label>
                <select ng-model="booking.type" required>
                    <option value="">Select room type</option>
                    <option value="Single">Single</option>
                    <option value="Double">Double</option>
                    <option value="Deluxe">Deluxe</option>
                    <option value="Suite">Suite</option>
                </select>

                <button type="submit">
                    {{ editingId ? 'Update Booking' : 'Book Room' }}
                </button>

                <button type="button" ng-click="cancelEdit()"
                        ng-if="editingId !== null">
                    Cancel Edit
                </button>
            </form>

            <p class="message">{{ message }}</p>
        </section>

        <section class="panel">
            <h2>All Bookings</h2>

            <input type="text" ng-model="search"
                   placeholder="Search guest, room or type">

            <button ng-click="refresh()">Refresh</button>

            <p>Total bookings: {{ bookings.length }}</p>

            <div class="booking"
                 ng-repeat="b in bookings | filter:search track by b.id">

                <p><b>Guest:</b> {{ b.guest }}</p>
                <p><b>Room:</b> {{ b.room }}</p>
                <p><b>Type:</b> {{ b.type }}</p>

                <button class="edit" ng-click="editBooking(b)">
                    Edit
                </button>

                <button class="delete" ng-click="deleteBooking(b.id)">
                    Delete
                </button>
            </div>

            <p ng-if="bookings.length === 0">No bookings found.</p>
        </section>

    </main>

    <footer>Hotel Booking Management System</footer>

    <script>
        var app = angular.module("hotelApp", []);

        app.controller("hotelController", function ($scope) {
            $scope.bookings = [];
            $scope.booking = {};
            $scope.editingId = null;
            $scope.nextId = 1;
            $scope.message = "";

            $scope.saveBooking = function () {
                var guest = $scope.booking.guest.trim();
                var room = $scope.booking.room.trim();
                var type = $scope.booking.type;

                var exists = $scope.bookings.some(function (b) {
                    return b.room.toLowerCase() === room.toLowerCase()
                        && b.type === type
                        && b.id !== $scope.editingId;
                });

                if (exists) {
                    $scope.message =
                        "Room already booked! Choose another room.";
                    return;
                }

                if ($scope.editingId !== null) {
                    var index = $scope.bookings.findIndex(function (b) {
                        return b.id === $scope.editingId;
                    });

                    if (index !== -1) {
                        $scope.bookings[index] = {
                            id: $scope.editingId,
                            guest: guest,
                            room: room,
                            type: type
                        };
                    }

                    $scope.message = "Booking updated successfully!";
                } else {
                    $scope.bookings.push({
                        id: $scope.nextId++,
                        guest: guest,
                        room: room,
                        type: type
                    });

                    $scope.message = "Booking added successfully!";
                }

                $scope.booking = {};
                $scope.editingId = null;
            };

            $scope.editBooking = function (b) {
                $scope.booking = {
                    guest: b.guest,
                    room: b.room,
                    type: b.type
                };

                $scope.editingId = b.id;
                $scope.message = "Edit the details and update.";
            };

            $scope.deleteBooking = function (id) {
                if (confirm("Do you want to delete this booking?")) {
                    $scope.bookings = $scope.bookings.filter(
                        function (b) {
                            return b.id !== id;
                        }
                    );

                    if ($scope.editingId === id) {
                        $scope.cancelEdit();
                    }

                    $scope.message = "Booking deleted successfully!";
                }
            };

            $scope.cancelEdit = function () {
                $scope.booking = {};
                $scope.editingId = null;
                $scope.message = "";
            };

            $scope.refresh = function () {
                $scope.search = "";
                $scope.message = "Booking list refreshed!";
            };
        });
    </script>

</body>
</html>
